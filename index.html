<style>
/* Layout: painel de gestão — barra lateral azul-marinho no computador, abas embaixo no celular; conteúdo denso em grade */
:root{
  --navy:#0B1F5C; --navy-2:#132B73; --accent:#1F4FFF; --accent-soft:#EBF0FF;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC; --ink:#0D1324; --muted:#667085; --faint:#98A2B3; --line:#E4E7EC;
  --pos:#067647; --pos-soft:#ECFDF3; --neg:#B42318; --neg-soft:#FEF3F2; --warn:#B54708; --warn-soft:#FFFAEB;
  --side:#0B1F5C; --side-ink:#C9D3F2;
  --f:"Plus Jakarta Sans",-apple-system,"Segoe UI",system-ui,sans-serif; --brand:"Sora","Plus Jakarta Sans",system-ui,sans-serif; --brand-blue:#3D6BFF; --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#6B8BFF; --accent-soft:#18213F; --bg:#0A0D14; --surface:#11151F; --surface-2:#0E121B; --ink:#E7E9EF; --muted:#8B93A7; --faint:#5D667A; --line:#1E2533;
  --pos:#47CD89; --pos-soft:#0E2A1E; --neg:#F97066; --neg-soft:#2D1414; --warn:#FDB022; --warn-soft:#2B2110; --side:#0B1328; --side-ink:#A9B4D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#6B8BFF; --accent-soft:#18213F; --bg:#0A0D14; --surface:#11151F; --surface-2:#0E121B; --ink:#E7E9EF; --muted:#8B93A7; --faint:#5D667A; --line:#1E2533;
  --pos:#47CD89; --pos-soft:#0E2A1E; --neg:#F97066; --neg-soft:#2D1414; --warn:#FDB022; --warn-soft:#2B2110; --side:#0B1328; --side-ink:#A9B4D6; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font-family:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1{font-family:var(--brand);font-size:26px;font-weight:700;letter-spacing:-.03em} h2{font-size:16px} h3{font-size:13px}
.wm{font-family:var(--brand);font-weight:800;letter-spacing:-.035em;line-height:1;white-space:nowrap}
.wm em{font-style:normal;color:var(--brand-blue);margin-left:.18em}
.wm-ia{display:inline-block;font-size:.62em;font-weight:800;letter-spacing:.02em;background:var(--brand-blue);color:#fff;padding:.18em .38em;border-radius:.3em;vertical-align:.22em;margin-left:.3em}
.muted{color:var(--muted)} .sm{font-size:12px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* shell */
.app{display:flex;min-height:100vh}
.side{display:none}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;height:58px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .mlogo{width:30px;height:30px;border-radius:8px;background:#fff;padding:2px;border:1px solid var(--line)}
.top .ttl{font-size:21px;color:var(--ink)}
.top .ttl .pg{display:none}
@media (min-width:960px){.top .ttl .wm{display:none}.top .ttl .pg{display:inline;font:600 15px var(--f);color:var(--muted)}}
.top .spacer{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--pos);display:block}
.ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ib:hover{color:var(--ink);border-color:var(--faint)}
.ib svg{width:18px;height:18px}
main{width:100%;max-width:1180px;margin:0 auto;padding-block:20px calc(var(--nav-h) + 40px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:16px}
.view.enter{animation:enter .28s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav-in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--faint);cursor:pointer}
.bnav button[aria-current="page"]{color:var(--accent)!important}
.bnav button svg{width:21px;height:21px}
.bnav button[aria-current="page"]{color:var(--ink)}
.bnav .orb{width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;margin-top:-4px}
.bnav button[aria-current="page"] .orb{background:var(--accent)}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;width:236px;flex:none;background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;padding:18px 14px;gap:4px}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 6px 22px;color:#fff}
  .brand img{width:44px;height:44px;border-radius:11px;background:#fff;padding:3px;flex:none}
  .brand .wm{font-size:25px;color:#fff;display:block}
  .brand .wm-ia{background:#3D6BFF}
  .brand span{display:block;font-size:11.5px;color:var(--side-ink);font-weight:500;margin-top:5px}
  .side .nv{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--side-ink);padding:9px 10px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;text-align:left}
  .side .nv svg{width:18px;height:18px;opacity:.9}
  .side .nv:hover{background:rgba(255,255,255,.06);color:#fff}
  .side .nv[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
  .side .nv .k{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.06em;background:#1F4FFF;color:#fff;padding:2px 6px;border-radius:5px}
  .side .new{margin-top:16px;border:0;background:#1F4FFF;color:#fff;border-radius:12px;padding:13px;font:700 15px var(--f);cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;box-shadow:0 8px 20px -8px rgba(31,79,255,.9)}
  .side .new:hover{background:#3D6BFF}
  .side .nv{font-size:15px!important;padding:11px 12px!important}
  .side .foot{margin-top:auto;font-size:12px;line-height:1.45;color:var(--side-ink);display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.08)}
  .side .foot svg{flex:none;width:16px;height:16px;margin-top:1px;color:#7CE0B3}
  .top .mlogo{display:none}
  .bnav{display:none}
  main{padding-block:26px 48px}
  :root{--nav-h:0px}
}

/* blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.pb{padding:14px 16px 16px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .v{font-size:22px;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;margin-top:2px;display:flex;gap:4px;align-items:center}
.up{color:var(--pos)} .down{color:var(--neg)}
@media (min-width:720px){.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi .v{font-size:24px}}
.g-main{grid-template-columns:minmax(0,1fr)}
@media (min-width:1080px){.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.g-2{grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;background:var(--ink);color:var(--surface);font-weight:700;font-size:14.5px;padding:11px 18px;border-radius:11px;cursor:pointer;white-space:nowrap;min-height:44px;transition:transform .12s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.btn.pri{background:#1F4FFF;color:#fff;box-shadow:0 6px 16px -6px rgba(31,79,255,.6)}
.btn.pri:hover{background:#1A43DB;box-shadow:0 8px 20px -6px rgba(31,79,255,.7)}
.btn.out{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.out:hover{border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);padding:6px 10px;min-height:34px;font-size:13px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--neg-soft);color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,transparent)}
@media (max-width:520px){.sync span{display:none}}
.btn:focus-visible,.ib:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed var(--faint);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--muted);background:var(--surface-2)}
.banner b{color:var(--ink);font-weight:600}
.banner .btn{margin-left:auto}

/* listas */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.row .g{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .m{font-size:12px;color:var(--muted)}
.row:hover .x{opacity:1}
.x{opacity:.45;border:0;background:none;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:6px;font-size:16px;flex:none}
.x:hover{background:var(--neg-soft);color:var(--neg);opacity:1}
@media (hover:none){.x{opacity:.7}}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--pos)}
.tag{font-size:11px;font-weight:500;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.emp{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tag.late{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,transparent);background:var(--neg-soft)}
.tag.today{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-soft)}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.ico svg{width:16px;height:16px}
.ico.in{color:var(--pos);background:var(--pos-soft);border-color:transparent}
.daylbl{padding:14px 16px 6px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.daylbl:first-child{border-top:0}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);background:none;cursor:pointer;flex:none;display:grid;place-items:center;color:#fff;padding:0}
.chk svg{width:13px;height:13px}
.chk[aria-pressed="true"]{background:var(--pos);border-color:var(--pos)}
.done .t{text-decoration:line-through;color:var(--faint)}
.empty{padding:18px 16px;color:var(--muted);font-size:13px}
.alerts{display:flex;flex-direction:column}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line);font-size:13px}
.al:first-child{border-top:0}
.al i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.al.bad i{background:var(--neg)} .al.warn i{background:var(--warn)} .al.ok i{background:var(--pos)}

/* barras */
.meter{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter>div{height:100%;background:var(--accent);border-radius:3px;transform-origin:left;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.meter.warn>div{background:var(--warn)} .meter.bad>div{background:var(--neg)} .meter.ok>div{background:var(--pos)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.brow:first-child{border-top:0}
.brow .meter{grid-column:1/-1}
.brow .n{font-size:12px;color:var(--muted)}

/* gráfico */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lb{fill:var(--faint);font:11px var(--mono)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .rec{stroke:var(--accent)} .chart .des{stroke:var(--ink);stroke-dasharray:4 4;opacity:.55}
.chart .ar{fill:var(--accent);opacity:.08}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;background:var(--accent);display:block}
.legend i.d{background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 7px);opacity:.6}

/* metas */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.goal{padding:16px;display:flex;flex-direction:column;gap:8px}
.goal .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.goal .pct{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.03em}
.goal .add{display:flex;gap:6px}
.goal .add input{flex:1;min-width:0;padding:7px 10px}

/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px 12px 14px}
.cal .wd{text-align:center;font-size:11px;color:var(--faint);font-weight:500;padding:6px 0}
.cal button{aspect-ratio:1/1;max-height:64px;border:1px solid transparent;background:none;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--mono);font-size:13px;color:var(--ink);padding:0}
.cal button:hover{background:var(--surface-2);border-color:var(--line)}
.cal button.out{color:var(--faint)}
.cal button.today{border-color:var(--accent);color:var(--accent);font-weight:600}
.cal button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal .dots i.t{background:var(--faint)} .cal .dots i.p{background:var(--warn)}
.cal button[aria-pressed="true"] .dots i{background:var(--surface)}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);width:44px;flex:none}

/* semana */
.week{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:900px){.week{grid-template-columns:repeat(7,minmax(0,1fr))}.week .wday{border-top:0;border-left:1px solid var(--line)}.week .wday:first-child{border-left:0}}
.wday{border-top:1px solid var(--line);padding:10px 12px;min-height:60px}
.wday:first-child{border-top:0}
.wday h3{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px}
.wday.is-today h3{color:var(--accent)}
.task{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}

/* IA */
.chatwrap{display:flex;flex-direction:column;min-height:calc(100vh - 58px - var(--nav-h) - 60px)}
.chat-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.chat-head img{width:40px;height:40px;border-radius:10px;background:#fff;padding:3px;border:1px solid var(--line)}
.msgs{flex:1;display:flex;flex-direction:column;gap:18px;padding:20px 0;max-width:760px;width:100%;margin:0 auto}

/* boas-vindas + conversa */

/* formulários e folha */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
input,select,textarea.in{font:14px var(--f);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--accent);outline:none}

.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.7,.2,1) both}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:14px;padding:22px}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;font-weight:500}
.pick button:hover{border-color:var(--accent)}
.pick button svg{width:20px;height:20px;color:var(--accent)}
.pick button span{font-size:12px;color:var(--muted);font-weight:400}
.err{color:var(--neg);font-size:12px;min-height:16px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(24px);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px);animation:up .2s both}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--neg);font-size:13px}
@media (max-width:420px){.fg{grid-template-columns:1fr}.kpi .v{font-size:19px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.chart .draw{stroke-dashoffset:0}}

  input,select,textarea,textarea.in,.cbox textarea,.bigask input{font-size:16px!important}
  body.kb .bnav{display:none}
  body.kb{--nav-h:0px}
  body.kb .composer{bottom:env(safe-area-inset-bottom,0px)}
}
.chatwrap{min-height:calc(100dvh - 58px - var(--nav-h) - 60px)}

<body>

<script>
(()=>{
"use strict";
const LS="orbita-ia-v1";
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=v=>brl.format(Number(v)||0);
const compact=v=>{v=Number(v)||0;const a=Math.abs(v);return a>=1e6?"R$ "+(v/1e6).toFixed(1).replace(".",",")+" mi":a>=1e3?"R$ "+(v/1e3).toFixed(a>=1e4?0:1).replace(".",",")+" mil":"R$ "+Math.round(v)};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const ym=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const parseD=s=>{const p=String(s||"").slice(0,10).split("-");return new Date(+p[0],(+p[1]||1)-1,+p[2]||1)};
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MESC=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const SEM=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const SEMF=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const fmtD=s=>{const d=parseD(s);return pad(d.getDate())+" "+MESC[d.getMonth()]};
const hora=s=>String(s||"").slice(11,16);
const num=s=>{s=String(s||"").replace(/[^\d,.-]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)};
const CATS={entrada:["Vendas","Serviços","Pró-labore","Salário","Aluguel recebido","Rendimentos","Empréstimo recebido","Reembolso","Outros"],saida:["Fornecedores","Funcionários","Pró-labore","Boleto","Financiamento","Empréstimo","Cartão de crédito","Aluguel","Impostos","Contador","Marketing","Energia/Água","Internet/Telefone","Software","Alimentação","Transporte","Saúde","Educação","Lazer","Outros"]};
const catsFor=tipo=>CATS[tipo].slice(0,-1).concat((S&&S.cats&&S.cats[tipo])||[]).concat(["Outros"]);
function addCat(tipo,c){c=String(c||"").trim().slice(0,40);if(!c)return"Outros";const all=catsFor(tipo).concat(catsFor(tipo==="entrada"?"saida":"entrada"));const hit=all.find(x=>x.toLowerCase()===c.toLowerCase());if(hit){if(!catsFor(tipo).includes(hit))S.cats[tipo].push(hit);return hit}S.cats[tipo].push(c);return c}
const I={
 painel:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
 financas:'<path d="M3 7h18v12H3zM3 11h18M7 15h4"/>',
 agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 plano:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 ia:'<ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-32 12 12)"/><circle cx="12" cy="12" r="3"/>',
 in:'<path d="M12 19V5M5 12l7-7 7 7"/>', out:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 task:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/>',
 goal:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
 budget:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 check:'<path d="M5 12l5 5 9-10"/>', send:'<path d="M5 12h14M13 6l6 6-6 6"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const svg=(k,w)=>'<svg viewBox="0 0 24 24" '+(w?'width="'+w+'" height="'+w+'" ':'')+'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[k]+'</svg>';
const TABS=[["painel","Painel"],["financas","Finanças"],["ia","Órbita IA"],["agenda","Agenda"],["plano","Planejamento"]];

/* ---------- dados ---------- */
function blank(){return{v:2,exemplo:false,nome:"",empresa:"",updatedAt:0,tx:[],eventos:[],tarefas:[],metas:[],orc:{},cats:{entrada:[],saida:[]},memoria:[],chat:[]}}
function normalize(s){
  if(!s||typeof s!=="object")return null;const b=blank();
  for(const k of["tx","eventos","tarefas","metas","chat"])b[k]=Array.isArray(s[k])?s[k]:[];
  if(!s.eventos&&Array.isArray(s.lembretes))b.eventos=s.lembretes.map(l=>({id:l.id||uid(),titulo:l.titulo,quando:l.quando,tipo:"lembrete",feito:!!l.feito}));
  b.orc=s.orc&&typeof s.orc==="object"?s.orc:{};
  b.cats={entrada:(s.cats&&Array.isArray(s.cats.entrada))?s.cats.entrada:[],saida:(s.cats&&Array.isArray(s.cats.saida))?s.cats.saida:[]};
  b.memoria=Array.isArray(s.memoria)?s.memoria.filter(x=>x&&x.texto):[];
  b.exemplo=!!s.exemplo;b.nome=String(s.nome||"");b.empresa=String(s.empresa||"");b.updatedAt=+s.updatedAt||0;
  b.chat=b.chat.filter(m=>m&&typeof m.content==="string");return b;
}
let S=null;try{S=normalize(JSON.parse(localStorage.getItem(LS)||"null"))}catch(e){}
if(!S || S.exemplo)S=blank();

let tab="painel",fin={conta:"todas",mes:ym(new Date()),q:""},cal={m:new Date(new Date().getFullYear(),new Date().getMonth(),1),sel:today()},confirmWipe=false,busy=false,ctrl=null;
let dbDoc=null,saveT=null,sample=null,sampleKnown=false,downloads=null;

function setSync(t,ok){$("#syncTxt").textContent=t;$("#syncDot").style.background=ok?"var(--pos)":"var(--warn)"}
function persist(){
  S.updatedAt=Date.now();if(S.chat.length>50)S.chat=S.chat.slice(-50);
  try{localStorage.setItem(LS,JSON.stringify(S));setSync("Salvo neste aparelho",true)}
  catch(e){setSync("Não foi possível salvar — baixe um backup",false);toast("Armazenamento indisponível ou cheio. Baixe um backup em Ajustes.");}

  clearTimeout(saveT);saveT=setTimeout(()=>{if(!dbDoc)return;setSync("Sincronizando…",false);
    dbDoc.set(JSON.parse(JSON.stringify(S))).then(()=>setSync("Sincronizado",true)).catch(()=>setSync("Salvo neste aparelho",true))},700);
}
function commit(keep){persist();render(keep!==false)}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;el.style.animation="none";el.offsetWidth;el.style.animation="";clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function dropEx(){if(S.exemplo){const n=S.nome,e=S.empresa,c=S.chat,ct=S.cats,me=S.memoria.filter(x=>!/^Exemplo:/.test(x.texto));S=blank();S.nome=n;S.empresa=e;S.chat=c;S.cats=ct;S.memoria=me}}

/* ---------- cálculos ---------- */
const doMes=(m,conta)=>S.tx.filter(t=>(t.data||"").slice(0,7)===m&&(!conta||conta==="todas"||t.conta===conta));
const soma=(l,tipo)=>l.filter(t=>t.tipo===tipo).reduce((a,t)=>a+(+t.valor||0),0);
const mesShift=(m,n)=>{const d=parseD(m+"-01");d.setMonth(d.getMonth()+n);return ym(d)};
function stEv(e){if(e.feito)return"ok";const d=new Date(e.quando),n=new Date();if(isNaN(d))return"";if(d<n)return"late";if(iso(d)===iso(n))return"today";return""}
function gastoCat(m){const o={};doMes(m).filter(t=>t.tipo==="saida").forEach(t=>o[t.categoria]=(o[t.categoria]||0)+(+t.valor||0));return o}
function avisos(){
  const out=[],m=ym(new Date());
  const late=S.eventos.filter(e=>stEv(e)==="late"),td=S.eventos.filter(e=>stEv(e)==="today");
  late.forEach(e=>out.push(["bad","Atrasado: "+e.titulo+" ("+fmtD(e.quando)+")"]));
  td.forEach(e=>out.push(["warn","Hoje às "+hora(e.quando)+": "+e.titulo]));
  const g=gastoCat(m);Object.keys(S.orc).forEach(c=>{const lim=+S.orc[c],v=g[c]||0;if(lim>0&&v>lim)out.push(["bad","Orçamento de "+c+" estourado: "+money(v)+" de "+money(lim)]);else if(lim>0&&v/lim>=.85)out.push(["warn","Orçamento de "+c+" em "+Math.round(v/lim*100)+"%"])});
  const e=doMes(m,"empresa"),r=soma(e,"entrada"),d=soma(e,"saida");if(r>0&&d>r)out.push(["bad","A empresa está gastando mais do que fatura neste mês."]);
  S.metas.forEach(x=>{if(!x.prazo)return;const dias=(parseD(x.prazo)-new Date())/864e5,p=x.alvo?x.atual/x.alvo:0;if(dias>=0&&dias<45&&p<.8)out.push(["warn","Meta “"+x.nome+"” vence em "+Math.ceil(dias)+" dias e está em "+Math.round(p*100)+"%"])});
  return out;
}

/* ---------- componentes ---------- */
const banner=()=>S.exemplo?'<div class="banner"><span><b>Você está vendo dados de exemplo.</b> Explore à vontade e, quando quiser, comece com os seus números.</span><button class="btn out" data-act="limparEx">Começar do zero</button></div>':"";
function txRow(t){return'<div class="row"><div class="ico '+(t.tipo==="entrada"?"in":"")+'">'+svg(t.tipo==="entrada"?"in":"out")+'</div><div class="g"><div class="t">'+esc(t.descricao)+'</div><div class="m">'+esc(t.categoria)+' · '+fmtD(t.data)+'</div></div><span class="tag '+(t.conta==="empresa"?"emp":"")+'">'+(t.conta==="empresa"?"Empresa":"Pessoal")+'</span><span class="amt '+(t.tipo==="entrada"?"in":"")+'">'+(t.tipo==="entrada"?"+":"−")+" "+money(t.valor)+'</span><button class="x" data-del="tx:'+t.id+'" aria-label="Apagar">×</button></div>'}
function evRow(e){const st=stEv(e);return'<div class="row'+(e.feito?" done":"")+'"><button class="chk" data-tog="eventos:'+e.id+'" aria-pressed="'+!!e.feito+'" aria-label="Concluir">'+(e.feito?svg("check"):"")+'</button><span class="time">'+hora(e.quando)+'</span><div class="g"><div class="t">'+esc(e.titulo)+'</div><div class="m">'+fmtD(e.quando)+' · '+({pagamento:"Pagamento",compromisso:"Compromisso",lembrete:"Lembrete"}[e.tipo]||"Lembrete")+'</div></div>'+(st==="late"?'<span class="tag late">Atrasado</span>':st==="today"?'<span class="tag today">Hoje</span>':"")+'<button class="x" data-del="eventos:'+e.id+'" aria-label="Apagar">×</button></div>'}
function chart(m0){
  const months=[];for(let i=5;i>=0;i--)months.push(mesShift(m0,-i));
  const R=months.map(m=>soma(doMes(m,"empresa"),"entrada")),D=months.map(m=>soma(doMes(m,"empresa"),"saida"));
  const W=640,H=220,L=56,Rr=12,T=14,B=28,max=Math.max(1,...R,...D)*1.12,step=Math.pow(10,Math.floor(Math.log10(max)));
  const tick=Math.ceil(max/4/step)*step,top=tick*4,x=i=>L+i*(W-L-Rr)/5,y=v=>T+(H-T-B)*(1-v/top);
  let g="";for(let k=0;k<=4;k++){const v=tick*k;g+='<line class="gl" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="lb" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(v>=1000?Math.round(v/1000)+"k":v)+'</text>'}
  months.forEach((m,i)=>g+='<text class="lb" x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+MESC[+m.slice(5)-1]+'</text>');
  const path=a=>a.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const area=path(R)+" L"+x(5)+" "+y(0)+" L"+x(0)+" "+y(0)+" Z";
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Receitas e despesas da empresa nos últimos 6 meses">'+g+'<path class="ar" d="'+area+'"/><path class="ln des draw" d="'+path(D)+'"/><path class="ln rec draw" d="'+path(R)+'"/>'+R.map((v,i)=>'<circle class="pt" r="3.5" cx="'+x(i)+'" cy="'+y(v)+'"><title>'+MES[+months[i].slice(5)-1]+": receitas "+money(v)+", despesas "+money(D[i])+'</title></circle>').join("")+'</svg>';
}
function kpi(lbl,v,prev,inv,fmt){
  let d="";if(prev>0){const p=(v-prev)/prev*100,good=inv?p<=0:p>=0;d='<div class="d '+(good?"up":"down")+'">'+(p>=0?"▲":"▼")+" "+Math.abs(p).toFixed(0)+'%<span class="muted">vs mês anterior</span></div>'}else d='<div class="d muted">sem comparação</div>';
  return'<div class="kpi"><div class="eyebrow">'+lbl+'</div><div class="v num" data-count="'+v+'" data-fmt="'+(fmt||"money")+'">'+(fmt==="pct"?Math.round(v)+"%":money(v))+'</div>'+d+'</div>';
}
function orcRows(m,limit){
  const g=gastoCat(m),cats=Object.keys(S.orc).filter(c=>+S.orc[c]>0);
  if(!cats.length)return'<div class="empty">Defina limites por categoria para controlar os gastos do mês.</div>';
  return cats.sort((a,b)=>(g[b]||0)/S.orc[b]-(g[a]||0)/S.orc[a]).slice(0,limit||99).map(c=>{const lim=+S.orc[c],v=g[c]||0,p=v/lim,cls=p>1?"bad":p>=.85?"warn":"";return'<div class="brow"><div><b style="font-weight:500">'+esc(c)+'</b> <span class="n">'+Math.round(p*100)+'%</span></div><div class="n num">'+money(v)+' / '+money(lim)+(limit?"":' <button class="x" data-del="orc:'+esc(c)+'" aria-label="Remover limite">×</button>')+'</div><div class="meter '+cls+'"><div style="width:'+Math.min(100,p*100)+'%"></div></div></div>'}).join("");
}

function planoSaude(){
  const m=ym(new Date()),pm=mesShift(m,-1),e=doMes(pm,"empresa"),sobra=soma(e,"entrada")-soma(e,"saida"),out=[];
  const need=S.metas.reduce((a,g)=>{const f=Math.max(0,g.alvo-g.atual);if(!g.prazo||f<=0)return a;return a+f/Math.max(1,Math.ceil((parseD(g.prazo)-new Date())/(30.4*864e5)))},0);
  out.push([need<=sobra?"ok":"warn","Suas metas pedem "+money(need)+"/mês. A empresa sobrou "+money(sobra)+" no mês passado."]);
  const tt=S.tarefas.filter(t=>{const d=parseD(t.dia),w=new Date();w.setDate(w.getDate()-w.getDay());w.setHours(0,0,0,0);return d>=w&&(d-w)<7*864e5});
  const dn=tt.filter(t=>t.feito).length;out.push([dn===tt.length&&tt.length?"ok":"",dn+" de "+tt.length+" tarefas da semana concluídas."]);
  return out.map(a=>'<div class="al '+a[0]+'"><i></i><span>'+esc(a[1])+'</span></div>').join("");
}

/* ---------- markdown simples ---------- */
function md(src){
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  let out="",list=null,para=[],tbl=[];
  const fp=()=>{if(para.length){out+="<p>"+inl(para.join("<br>"))+"</p>";para=[]}};
  const fl=()=>{if(list){out+="</"+list+">";list=null}};
  const ft=()=>{if(!tbl.length)return;const rows=tbl.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>inl(c.trim())));
    out+='<div class="tw"><table>'+rows.map((r,i)=>"<tr>"+r.map(c=>i?"<td>"+c+"</td>":"<th>"+c+"</th>").join("")+"</tr>").join("")+"</table></div>";tbl=[]};
  for(const raw of esc(src).split("\n")){
    const l=raw.replace(/\s+$/,"");let m;
    if(/^\s*\|/.test(l)){fp();fl();tbl.push(l);continue}else ft();
    if(!l.trim()){fp();fl();continue}
    if((m=l.match(/^#{1,6}\s+(.*)/))){fp();fl();out+="<h4>"+inl(m[1])+"</h4>";continue}
    if(/^\s*([-*_])\1{2,}\s*$/.test(l)){fp();fl();out+="<hr>";continue}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){fp();if(list!=="ul"){fl();out+="<ul>";list="ul"}out+="<li>"+inl(m[1])+"</li>";continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){fp();if(list!=="ol"){fl();out+="<ol>";list="ol"}out+="<li>"+inl(m[1])+"</li>";continue}
    fl();para.push(l);
  }
  ft();fp();fl();return out;
}

function countUp(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,f=el.dataset.fmt,t0=performance.now();
    const fmt=v=>f==="pct"?Math.round(v)+"%":f==="int"?String(Math.round(v)):money(v);
    const step=t=>{const p=Math.min(1,(t-t0)/650),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}
